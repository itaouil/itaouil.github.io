# this file uses the prebuilt image on dockerhub
# one-command local preview:  docker compose up   ->   http://localhost:8080
services:
  jekyll:
    image: amirpourmand/al-folio
    build: .
    # host networking: lets bundler reach rubygems.org to install the compat gems
    # above and serves directly on http://localhost:8080 (Linux hosts)
    network_mode: host
    volumes:
      - .:/srv/jekyll
